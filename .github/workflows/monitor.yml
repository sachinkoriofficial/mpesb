name: MPESB Website Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Check MPESB website
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python monitor.py

      - name: Save monitoring state
        run: |
          git config user.name "MPESB Monitor Bot"
          git config user.email "actions@github.com"

          git add esb_state.json

          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "Update MPESB monitoring state"
            git push
          fi
