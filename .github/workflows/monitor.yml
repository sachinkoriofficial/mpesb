name: MPESB Website Monitor

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Telegram Test
        if: github.event_name == 'workflow_dispatch'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          message = """✅ MPESB MONITOR CONNECTED!

🤖 Telegram Bot: @Smpltd_bot
🔗 GitHub Actions: Connected
🌐 Website Monitor: Ready

अब ESB website में नया update मिलने पर notification यहाँ आएगा। 🚨"""

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          response = requests.post(
              url,
              data={
                  "chat_id": chat_id,
                  "text": message
              },
              timeout=30
          )

          response.raise_for_status()
          print("Telegram test message sent successfully.")
          PY

      - name: Check MPESB website
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python monitor.py

      - name: Save monitoring state
        run: |
          git config user.name "MPESB Monitor Bot"
          git config user.email "actions@github.com"

          git add esb_state.json

          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "Update MPESB monitoring state"
            git push
          fi
